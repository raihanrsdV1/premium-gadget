# ============================================================
# BASE compose = PRODUCTION config (postgres + backend + caddy TLS proxy).
#   - schema comes ONLY from migrations (deploy.sh runs `npm run migrate`);
#     no seed / demo data is ever loaded here
#   - secrets are REQUIRED from .env — compose refuses to start without them
#   - postgres and the API listen on localhost only; Caddy is the only
#     internet-facing service (80/443, automatic HTTPS for API_DOMAIN)
#
# Local development overrides live in docker-compose.override.yml, which Docker
# Compose auto-merges on a plain `docker compose up`. In production / CI,
# deploy with ONLY this file (deploy/deploy.sh does exactly that):
#     docker compose -f docker-compose.yml up -d
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ─── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pg_premium_gadget
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # localhost-only — reachable from the droplet (backups, admin tools),
      # never from the internet. The backend uses the compose network.
      - '127.0.0.1:5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ─── Express Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: premium-gadget-backend
    container_name: api_premium_gadget
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Use URL-safe passwords (e.g. `openssl rand -hex 24`) — this is a URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_STAFF_EXPIRES_IN: ${JWT_STAFF_EXPIRES_IN:-12h}
      # Storefront domain(s) + the local admin app origin, comma-separated.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # Hops in front of the API: Caddy only = 1; Cloudflare proxy → Caddy = 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      POS_MAX_STAFF_DISCOUNT_PCT: ${POS_MAX_STAFF_DISCOUNT_PCT:-10}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:?Set SSLCOMMERZ_STORE_ID in .env}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:?Set SSLCOMMERZ_STORE_PASSWORD in .env}
      SSLCOMMERZ_IS_SANDBOX: ${SSLCOMMERZ_IS_SANDBOX:?Set SSLCOMMERZ_IS_SANDBOX (true while testing, false when live)}
      # Pre-launch testing only: lets the API boot in production with sandbox payments.
      ALLOW_SANDBOX_IN_PRODUCTION: ${ALLOW_SANDBOX_IN_PRODUCTION:-false}
      # Public URLs for SSLCommerz callbacks + post-payment redirect.
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:5001/api/v1}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      STOREFRONT_REVALIDATE_URL: ${STOREFRONT_REVALIDATE_URL:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Product images (Cloudflare R2).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-PremiumGadget}
    ports:
      # localhost-only: the internet reaches the API through Caddy (HTTPS).
      - '127.0.0.1:5001:5000'
    logging: *default-logging

  # ─── Caddy (automatic HTTPS reverse proxy) ───────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy_premium_gadget
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  pg_data:
  caddy_data:
  caddy_config:
